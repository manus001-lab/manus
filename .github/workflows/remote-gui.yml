name: Ephemeral Ubuntu GUI

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Maximum runtime in minutes (1-60)'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NOVNC_PASSWORD: ${{ secrets.NOVNC_PASSWORD }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      MISTRAL_API_BASE: https://api.mistral.ai/v1
      MISTRAL_MODEL: pixtral-large-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate required secrets without printing them
        shell: bash
        run: |
          ok=1
          if [ -z "$NOVNC_PASSWORD" ]; then echo 'NOVNC_PASSWORD is missing'; ok=0; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo 'BACKUP_PASSPHRASE is missing'; ok=0; fi
          if [ -z "$MISTRAL_API_KEY" ]; then echo 'MISTRAL_API_KEY is missing'; ok=0; fi
          test "$ok" -eq 1
      - name: Restore existing image or build a new one
        shell: bash
        run: |
          set -u
          rm -rf persistent-backup
          restored=1
          if git ls-remote --exit-code --heads origin container-backup >/dev/null 2>&1; then
            git fetch --no-tags origin container-backup:refs/remotes/origin/container-backup
            mkdir -p persistent-backup
            git archive "origin/container-backup" | tar -x -C persistent-backup
          fi
          if [ -f persistent-backup/SHA256SUMS ]; then
            echo 'Encrypted backup found; attempting restore'
            if BACKUP_PASSPHRASE="$BACKUP_PASSPHRASE" ./scripts/restore.sh persistent-backup restored/gui-runner:latest; then
              restored=0
            else
              echo 'Restore failed; keeping the old backup and falling back to a fresh build'
            fi
          else
            echo 'No encrypted backup found; creating a new image'
          fi
          if [ "$restored" -eq 0 ]; then
            docker tag restored/gui-runner:latest manus-gui:ci || { echo 'Restored image tag is missing' >&2; exit 1; }
            echo 'NEW_IMAGE=0' >> "$GITHUB_ENV"
          else
            echo 'Building a fresh image without deleting the old Git backup'
            docker build --tag manus-gui:ci . || { echo 'Docker build failed; stopping before container start' >&2; exit 1; }
            docker image inspect manus-gui:ci >/dev/null || { echo 'Built image is missing; stopping' >&2; exit 1; }
            echo 'NEW_IMAGE=1' >> "$GITHUB_ENV"
          fi
      - name: Start candidate GUI container
        run: |
          docker rm -f manus-gui-candidate manus-gui-previous >/dev/null 2>&1 || true
          if docker container inspect manus-gui >/dev/null 2>&1; then
            docker stop manus-gui >/dev/null
            docker rename manus-gui manus-gui-previous
          fi
          docker run -d --name manus-gui-candidate \
            -p 127.0.0.1:6080:6080 -p 127.0.0.1:8080:8080 \
            -e NOVNC_PASSWORD -e MISTRAL_API_KEY -e MISTRAL_API_BASE -e MISTRAL_MODEL \
            manus-gui:ci
          if [ "${NEW_IMAGE:-1}" = '1' ]; then
            health_ok=0
            for i in {1..60}; do
              if curl --fail --silent --max-time 2 http://127.0.0.1:8080/health >/dev/null; then health_ok=1; break; fi
              sleep 2
            done
            if [ "$health_ok" -ne 1 ]; then
              echo 'Candidate API health check timed out' >&2
              docker logs manus-gui-candidate || true
              exit 1
            fi
          fi
      - name: Promote candidate and retain one previous container
        run: |
          if [ "${NEW_IMAGE:-1}" = '1' ] && ! curl --fail --silent --max-time 5 http://127.0.0.1:8080/health >/dev/null; then
            echo 'Candidate is unhealthy; restoring previous container' >&2
            docker logs manus-gui-candidate || true
            docker rm -f manus-gui-candidate || true
            if docker container inspect manus-gui-previous >/dev/null 2>&1; then
              docker rename manus-gui-previous manus-gui
              docker start manus-gui >/dev/null
            fi
            exit 1
          fi
          docker rename manus-gui-candidate manus-gui
      - name: Start temporary authenticated access tunnel
        shell: bash
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          for i in {1..30}; do
            url=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            if [ -n "$url" ]; then echo "Temporary noVNC URL: $url"; break; fi
            sleep 2
          done
      - name: Verify browsers, sudo, apt, dimensions, and noVNC (new image only)
        if: env.NEW_IMAGE == '1'
        run: |
          docker exec manus-gui bash -lc 'command -v firefox && command -v microsoft-edge && sudo -n true && apt-get --version >/dev/null'
          curl --fail --silent http://127.0.0.1:8080/health | tee health.json
          curl --fail --silent http://127.0.0.1:6080/vnc.html | grep -qi noVNC
      - name: Optional encrypted split image backup
        run: |
          chmod +x scripts/backup.sh
          rm -rf persistent-backup.new
          ./scripts/backup.sh manus-gui:ci persistent-backup.new
          rm -rf persistent-backup.old
          if [ -d persistent-backup ]; then mv persistent-backup persistent-backup.old; fi
          mv persistent-backup.new persistent-backup
      - name: Replace backup branch with latest encrypted parts
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_dir=$(mktemp -d)
          git worktree add --detach "$publish_dir" HEAD
          git -C "$publish_dir" switch --orphan container-backup-new
          git -C "$publish_dir" rm -rf . >/dev/null 2>&1 || true
          cp -a persistent-backup/. "$publish_dir"/
          git -C "$publish_dir" add -f .
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" commit -m "Replace encrypted GUI container backup"
          git -C "$publish_dir" push --force origin HEAD:container-backup
          git worktree remove --force "$publish_dir"
      - name: Keep session available briefly for manual noVNC inspection
        if: ${{ success() }}
        shell: bash
        run: |
          minutes='${{ inputs.run_minutes }}'
          if ! [[ "$minutes" =~ ^[0-9]+$ ]]; then minutes=60; fi
          seconds=$(( minutes * 60 ))
          if [ "$seconds" -gt 3600 ]; then seconds=3600; fi
          sleep "$seconds"
      - name: Cleanup
        if: always()
        run: |
          docker rm -f manus-gui-candidate manus-gui || true
          # manus-gui-previous is intentionally retained, with at most one previous container.
