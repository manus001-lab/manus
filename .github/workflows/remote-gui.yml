name: Ephemeral Ubuntu GUI

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Maximum runtime in minutes (1-60)'
        required: false
        default: '60'

permissions:
  contents: read

jobs:
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NOVNC_PASSWORD: ${{ secrets.NOVNC_PASSWORD }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      MISTRAL_API_BASE: https://api.mistral.ai/v1
      MISTRAL_MODEL: pixtral-large-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets without printing them
        shell: bash
        run: |
          ok=1
          if [ -z "$NOVNC_PASSWORD" ] || [ "${#NOVNC_PASSWORD}" -lt 12 ]; then echo 'NOVNC_PASSWORD is missing or shorter than 12 characters'; ok=0; fi
          if [ -z "$BACKUP_PASSPHRASE" ] || [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then echo 'BACKUP_PASSPHRASE is missing or shorter than 16 characters'; ok=0; fi
          if [ -z "$MISTRAL_API_KEY" ]; then echo 'MISTRAL_API_KEY is missing'; ok=0; fi
          test "$ok" -eq 1
      - name: Build image
        run: docker build --tag manus-gui:ci .
      - name: Start GUI container
        run: |
          docker run -d --name manus-gui \
            -p 127.0.0.1:6080:6080 -p 127.0.0.1:8080:8080 \
            -e NOVNC_PASSWORD -e MISTRAL_API_KEY -e MISTRAL_API_BASE -e MISTRAL_MODEL \
            manus-gui:ci
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:8080/health && break || sleep 2; done
      - name: Start temporary authenticated access tunnel
        shell: bash
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          for i in {1..30}; do
            url=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' cloudflared.log | head -n1 || true)
            if [ -n "$url" ]; then echo "Temporary noVNC URL: $url"; break; fi
            sleep 2
          done
      - name: Verify browsers, sudo, apt, dimensions, and noVNC
        run: |
          docker exec manus-gui bash -lc 'command -v firefox && command -v microsoft-edge && sudo -n true && apt-get --version >/dev/null'
          curl --fail --silent http://127.0.0.1:8080/health | tee health.json
          curl --fail --silent http://127.0.0.1:6080/vnc.html | grep -qi noVNC
      - name: Optional encrypted split image backup
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh manus-gui:ci backup-parts
      - name: Upload encrypted backup parts
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-gui-image-${{ github.run_id }}
          path: backup-parts/
          retention-days: 7
      - name: Keep session available briefly for manual noVNC inspection
        if: ${{ success() }}
        shell: bash
        run: |
          minutes='${{ inputs.run_minutes }}'
          if ! [[ "$minutes" =~ ^[0-9]+$ ]]; then minutes=60; fi
          seconds=$(( minutes * 60 ))
          if [ "$seconds" -gt 3600 ]; then seconds=3600; fi
          sleep "$seconds"
      - name: Cleanup
        if: always()
        run: docker rm -f manus-gui || true
