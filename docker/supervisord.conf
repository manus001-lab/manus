[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx%(ENV_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10

[program:xfce]
command=/bin/bash -lc "until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 1; done; dbus-launch --exit-with-session startxfce4"
environment=DISPLAY=":99",XAUTHORITY="/tmp/.Xauthority",HOME="/home/ubuntuuser",USER="ubuntuuser"
user=ubuntuuser
autostart=true
autorestart=true
priority=20

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -localhost -rfbauth /tmp/vnc.pass
user=ubuntuuser
autostart=true
autorestart=true
priority=30

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
user=ubuntuuser
autostart=true
autorestart=true
priority=40

[program:api]
command=/usr/bin/python3 /opt/gui-app/server.py
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
user=ubuntuuser
environment=DISPLAY=":99",XAUTHORITY="/tmp/.Xauthority",HOME="/home/ubuntuuser",PORT="8080"
directory=/opt/gui-app
autostart=true
autorestart=true
priority=50
